<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Fashion E-Commerce</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background: #333;
            padding: 12px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
        }

        .hero {
            text-align: center;
            padding: 70px 20px;
            background: white;
        }

        .hero h1 {
            font-size: 42px;
        }

        .hero p {
            font-size: 20px;
        }

        .button {
            display: inline-block;
            padding: 12px 25px;
            background: #222;
            color: white;
            text-decoration: none;
            margin-top: 15px;
            border-radius: 5px;
        }

        .categories {
            text-align: center;
            padding: 40px;
        }

        .category-box {
            display: inline-block;
            background: white;
            padding: 25px;
            margin: 10px;
            width: 150px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<header>
    <h1>Fashion E-Commerce Store</h1>
    <p>Style. Comfort. Confidence.</p>
</header>

<nav>
    <a th:href="@{/}">Home</a>
    <a th:href="@{/products}">Products</a>
    <a th:href="@{/login}">Login</a>
    <a th:href="@{/register}">Register</a>
    <a th:href="@{/cart}">Cart</a>
    <a th:href="@{/wishlist}">Wishlist</a>
</nav>

<section class="hero">

    <h1>Welcome to Our Fashion Store</h1>

    <p>
        Discover the latest fashion collections for everyone.
    </p>

    <a class="button" th:href="@{/products}">
        Shop Now
    </a>

</section>

<section class="categories">

    <h2>Shop By Category</h2>

    <div class="category-box">
        <h3>Men</h3>
    </div>

    <div class="category-box">
        <h3>Women</h3>
    </div>

    <div class="category-box">
        <h3>Kids</h3>
    </div>

    <div class="category-box">
        <h3>Accessories</h3>
    </div>

</section>

</body>
</html>
