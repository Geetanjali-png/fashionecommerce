<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Shopping Cart</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
        }

        .cart-item {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
        }

        .cart-item h2 {
            margin-top: 0;
        }

        input {
            width: 60px;
            padding: 8px;
        }

        button {
            padding: 8px 15px;
            border: none;
            background: #222;
            color: white;
            cursor: pointer;
            margin-left: 5px;
        }

        .remove {
            background: #b00020;
        }

        .total {
            background: white;
            padding: 20px;
            margin-top: 20px;
            border-radius: 10px;
            text-align: right;
        }

        .checkout {
            display: inline-block;
            padding: 12px 20px;
            background: green;
            color: white;
            text-decoration: none;
            margin-top: 10px;
            border-radius: 5px;
        }

        .empty {
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 10px;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>Fashion Store</h1>
    <h2>Shopping Cart</h2>
</header>

<div class="container">

    <!-- EMPTY CART -->

    <div class="empty"
         th:if="${cart.items.isEmpty()}">

        <h2>Your cart is empty</h2>

        <p>Add some fashion products to your cart.</p>

        <a th:href="@{/products}">
            Continue Shopping
        </a>

    </div>

    <!-- CART ITEMS -->

    <div th:unless="${cart.items.isEmpty()}">

        <div class="cart-item"
             th:each="item : ${cart.items}">

            <h2 th:text="${item.product.name}">
                Product Name
            </h2>

            <p th:text="${item.product.description}">
                Product Description
            </p>

            <p>
                Price:
                ₹<span th:text="${item.product.price}">0</span>
            </p>

            <p>
                Quantity:
            </p>

            <form th:action="@{/cart/update/{id}(id=${item.id})}"
                  method="post"
                  style="display:inline;">

                <input type="number"
                       name="quantity"
                       min="1"
                       th:value="${item.quantity}"
                       required>

                <button type="submit">
                    Update
                </button>

            </form>

            <form th:action="@{/cart/remove/{id}(id=${item.id})}"
                  method="post"
                  style="display:inline;">

                <button type="submit"
                        class="remove">
                    Remove
                </button>

            </form>

            <p>
                Item Total:
                ₹<span
                    th:text="${item.product.price * item.quantity}">
                </span>
            </p>

        </div>

        <!-- TOTAL -->

        <div class="total">

            <h2>
                Cart Total:
                ₹<span th:text="${total}">0</span>
            </h2>

            <a class="checkout"
               th:href="@{/checkout}">
                Proceed to Checkout
            </a>

        </div>

    </div>

    <a class="back"
       th:href="@{/products}">
        ← Continue Shopping
    </a>

</div>

</body>

</html>
