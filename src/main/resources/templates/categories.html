<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Categories - Fashion Store</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        header {
            background: #222;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 35px auto;
        }

        .categories {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .category {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .category h2 {
            margin-top: 0;
        }

        .category p {
            color: #666;
            line-height: 1.5;
        }

        .products {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 18px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .empty {
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 10px;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            color: #222;
            text-decoration: none;
        }
    </style>
</head>

<body>

<header>
    <h1>Fashion Store</h1>
    <h2>Categories</h2>
</header>

<div class="container">

    <div class="empty"
         th:if="${categories == null || categories.isEmpty()}">

        <h2>No Categories Available</h2>

        <p>
            Categories will appear here when they are added.
        </p>

    </div>

    <div class="categories"
         th:unless="${categories == null || categories.isEmpty()}">

        <div class="category"
             th:each="category : ${categories}">

            <h2 th:text="${category.name}">
                Category Name
            </h2>

            <p th:text="${category.description}">
                Category Description
            </p>

            <a class="products"
               th:href="@{/products(category=${category.id})}">
                View Products
            </a>
        </div>

    </div>

    <a class="back"
       th:href="@{/}">
        ← Back to Home
    </a>

</div>

</body>

</html>
