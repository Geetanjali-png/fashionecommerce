<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Order Details</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .order-info {
            margin: 10px 0;
        }

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 5px;
            background: #e7f7e7;
            color: green;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #222;
            color: white;
        }

        .total {
            text-align: right;
            font-size: 22px;
            font-weight: bold;
            margin-top: 20px;
        }

        .btn {
            display: inline-block;
            padding: 10px 18px;
            margin-top: 10px;
            margin-right: 10px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .btn:hover {
            background: #444;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #777;
        }

    </style>

</head>

<body>

<header>

    <h1>Order Details</h1>

</header>


<div class="container">


    <!-- ORDER INFORMATION -->

    <div class="card">

        <h2>

            Order #

            <span th:text="${order.id}">
                1
            </span>

        </h2>


        <p class="order-info">

            <strong>Order Date:</strong>

            <span th:text="${order.orderDate}">
                Date
            </span>

        </p>


        <p class="order-info">

            <strong>Status:</strong>

            <span class="status"
                  th:text="${order.status}">

                PLACED

            </span>

        </p>

    </div>



    <!-- ORDER ITEMS -->

    <div class="card">

        <h2>Items Ordered</h2>


        <div th:if="${order.items != null && !order.items.isEmpty()}">

            <table>

                <thead>

                <tr>

                    <th>Product</th>

                    <th>Quantity</th>

                    <th>Price</th>

                    <th>Subtotal</th>

                </tr>

                </thead>


                <tbody>

                <tr th:each="item : ${order.items}">

                    <td th:text="${item.product.name}">

                        Product

                    </td>


                    <td th:text="${item.quantity}">

                        1

                    </td>


                    <td>

                        ₹<span th:text="${item.price}">
                            0
                        </span>

                    </td>


                    <td>

                        ₹<span th:text="${item.price * item.quantity}">
                            0
                        </span>

                    </td>

                </tr>

                </tbody>

            </table>


            <p class="total">

                Total: ₹<span th:text="${order.totalAmount}">
                    0
                </span>

            </p>

        </div>


        <div th:if="${order.items == null || order.items.isEmpty()}"
             class="empty">

            No items found for this order.

        </div>

    </div>



    <!-- NAVIGATION -->

    <div class="card">

        <a href="/orders"
           class="btn">

            ← My Orders

        </a>


        <a href="/products"
           class="btn">

            Continue Shopping

        </a>

    </div>

</div>

</body>

</html>
