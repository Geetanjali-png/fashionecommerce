<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Confirmation - Fashion Store</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #222;
            color: white;
            padding: 22px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.12);
        }

        .success {
            text-align: center;
        }

        .success h2 {
            color: green;
            font-size: 28px;
        }

        .order-info {
            margin-top: 30px;
            padding: 20px;
            background: #f8f8f8;
            border-radius: 8px;
        }

        .order-item {
            padding: 15px 0;
            border-bottom: 1px solid #ddd;
        }

        .order-item:last-child {
            border-bottom: none;
        }

        .total {
            text-align: right;
            font-size: 22px;
            font-weight: bold;
            margin-top: 20px;
        }

        .buttons {
            margin-top: 30px;
            text-align: center;
        }

        .buttons a {
            display: inline-block;
            padding: 12px 20px;
            margin: 5px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .buttons a:hover {
            background: #444;
        }
    </style>
</head>

<body>

<header>
    <h1>Fashion Store</h1>
</header>

<div class="container">

    <div class="card">

        <div class="success">

            <h2>✓ Order Placed Successfully!</h2>

            <p>
                Thank you for your order.
            </p>

        </div>

        <div class="order-info">

            <h2>Order Details</h2>

            <p>
                <strong>Order ID:</strong>
                <span th:text="${order.id}">
                    0
                </span>
            </p>

            <p>
                <strong>Status:</strong>
                <span th:text="${order.status}">
                    PLACED
                </span>
            </p>

            <p>
                <strong>Order Date:</strong>
                <span th:text="${order.orderDate}">
                    Date
                </span>
            </p>

        </div>

        <div class="order-info">

            <h2>Items Ordered</h2>

            <div class="order-item"
                 th:each="item : ${order.items}">

                <h3 th:text="${item.product.name}">
                    Product
                </h3>

                <p>
                    Price:
                    ₹<span th:text="${item.price}">
                        0
                    </span>
                </p>

                <p>
                    Quantity:
                    <span th:text="${item.quantity}">
                        1
                    </span>
                </p>

                <p>
                    Item Total:
                    ₹<span th:text="${item.price * item.quantity}">
                        0
                    </span>
                </p>

            </div>

            <div class="total">

                Total Amount:
                ₹<span th:text="${order.totalAmount}">
                    0
                </span>

            </div>

        </div>

        <div class="buttons">

            <a th:href="@{/orders}">
                My Orders
            </a>

            <a th:href="@{/products}">
                Continue Shopping
            </a>

            <a th:href="@{/}">
                Home
            </a>

        </div>

    </div>

</div>

</body>

</html>
